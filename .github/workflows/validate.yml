name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: latest

      # Same pinned tooling as `make setup`: uv.lock -> .venv (ansible-core, pre-commit)
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync tooling
        run: make sync

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Run pre-commit
        run: make run

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: latest

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync tooling and Galaxy content
        run: make sync galaxy

      # Builds need KVM and multi-GB downloads, so CI only checks syntax/config.
      - name: Validate Packer templates, Vagrantfiles, and playbooks
        run: make validate
