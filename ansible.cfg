# Shared Ansible config for all labs. Ansible and ansible-lint pick it up when run
# from the repo root; Vagrantfiles point at it via `ansible.config_file`.
[defaults]
# Relative to this file. Galaxy content from ansible/requirements.yml lands in
# ansible/galaxy_roles and ansible/collections (both gitignored).
roles_path = ansible/roles:ansible/galaxy_roles
collections_path = ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
